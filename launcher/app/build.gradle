plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('studio.tvcustomizer.home')
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '3.0-studio.1'
    }

    signingConfigs {
        studio {
            if (System.getenv('STUDIO_KEYSTORE')) {
                storeFile file(System.getenv('STUDIO_KEYSTORE'))
                storePassword System.getenv('STUDIO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STUDIO_KEY_ALIAS')
                keyPassword System.getenv('STUDIO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB by the desktop app. CI signs with the release key from STUDIO_KEYSTORE when it
            // is set, so every official build can update the previous one; local builds fall back to the debug key.
            signingConfig System.getenv('STUDIO_KEYSTORE') ? signingConfigs.studio : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
