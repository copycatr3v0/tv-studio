[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"
once_cell = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3"
tvs-core = { path = "crates/tvs-core" }
tvs-transport = { path = "crates/tvs-transport" }
tvs-safety = { path = "crates/tvs-safety" }
tvs-store = { path = "crates/tvs-store" }
tvs-device = { path = "crates/tvs-device" }
tvs-kb = { path = "crates/tvs-kb" }
tvs-recovery = { path = "crates/tvs-recovery" }
tvs-launcher = { path = "crates/tvs-launcher" }
tvs-deploy = { path = "crates/tvs-deploy" }
tvs-insight = { path = "crates/tvs-insight" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Image resizing is unusably slow unoptimized; keep it fast in debug builds and tests.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
