[package]
name = "tv-studio"
description = "Android TV Customizer Studio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tv_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tvs-core.workspace = true
tvs-transport.workspace = true
tvs-safety.workspace = true
tvs-store.workspace = true
tvs-device.workspace = true
tvs-kb.workspace = true
tvs-recovery.workspace = true
tvs-launcher.workspace = true
tvs-deploy.workspace = true
tvs-insight.workspace = true
tvs-demo.workspace = true
regex.workspace = true
base64 = "0.22"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
